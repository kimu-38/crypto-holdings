<!DOCTYPE html>
<html lang="ja">
<head>

<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14202b;--mute:#5d6b78;--line:#d6dde4;--acc:#1f4fd8;--accink:#fff;--bar:#c9d6f7;--up:#0a7a48;--down:#b42318;--warn:#fff4d6;--warnink:#6b4a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f151b;--card:#18212a;--ink:#e7edf3;--mute:#98a6b3;--line:#2b3742;--acc:#7a9bff;--accink:#0f151b;--bar:#24365e;--up:#4cd08e;--down:#ff8a7d;--warn:#3a2f10;--warnink:#f3d98b}}
:root[data-theme="dark"]{--bg:#0f151b;--card:#18212a;--ink:#e7edf3;--mute:#98a6b3;--line:#2b3742;--acc:#7a9bff;--accink:#0f151b;--bar:#24365e;--up:#4cd08e;--down:#ff8a7d;--warn:#3a2f10;--warnink:#f3d98b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:540px;margin:0 auto;padding:16px 14px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-size:15px;font-weight:500;color:var(--mute);margin:4px 0 2px}
h2{font-size:16px;margin:22px 0 8px}
.big{font-size:clamp(38px,12vw,56px);font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.big small{font-size:.4em;font-weight:500;margin-left:4px}
.sub{color:var(--mute);font-size:14px}
.up{color:var(--up)}.down{color:var(--down)}
.diff{font-size:20px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.two .card{padding:12px 14px}.two b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.row{padding:11px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.row:last-child{border-bottom:0}
.row .amt{font-weight:500;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row .s2{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);color:var(--mute);border-radius:99px;padding:0 8px;margin-left:6px}
.tag.w{background:var(--warn);color:var(--warnink);border-color:transparent}
button{font:inherit;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 18px;cursor:pointer;font-weight:500}
button.p{background:var(--acc);color:var(--accink);border-color:var(--acc);width:100%;font-size:18px;font-weight:700;margin-top:14px}
button.p2{width:100%;font-size:18px;font-weight:700;margin-top:12px;border-color:var(--acc);color:var(--acc)}
button.p:disabled{opacity:.6}
button.s{min-height:44px;padding:0 12px;font-size:14px}
button.dg{color:var(--down)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.warn{background:var(--warn);color:var(--warnink);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:15px}
.warn b{font-weight:700}
.toast{background:var(--acc);color:var(--accink);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:500}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{border:0;border-radius:0;background:none;min-height:56px;font-size:14px;color:var(--mute);padding:0 4px}
.tabs button[aria-current="page"]{color:var(--acc);font-weight:700}
.qrow{display:grid;grid-template-columns:1fr 150px 40px;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.qrow input{text-align:right;font-size:18px;min-height:46px;font-variant-numeric:tabular-nums}
.qrow .x{min-height:40px;padding:0;color:var(--mute)}
.hd{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;background:var(--bg);border-bottom:1px solid var(--line);font-weight:700}
.hd span:last-child{font-variant-numeric:tabular-nums}
.add{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 14px}
.stack{display:grid;gap:8px;padding:12px 14px}
.cb{display:grid;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.cb:last-child{border-bottom:0}
.cb .two2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lbl{font-size:13px;color:var(--mute);margin-bottom:2px}
.cand{display:grid;gap:6px}
.cand button{min-height:44px;text-align:left;font-size:14px;font-weight:400}
.hrow{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;border:0;border-bottom:1px solid var(--line);border-radius:0;background:var(--card);min-height:64px;padding:8px 14px;gap:10px}
.hrow:last-child{border-bottom:0}
.hrow .amt{font-variant-numeric:tabular-nums;white-space:nowrap}
.srow{display:grid;grid-template-columns:1fr 120px;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
.srow:last-child{border-bottom:0}
.srow .sx{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
textarea{min-height:110px;font:13px/1.4 ui-monospace,Menlo,monospace}
a{color:var(--acc)}
.foot{margin-top:22px;font-size:13px;color:var(--mute)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:46px}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:700}
.sel{background:var(--bar);border-radius:10px;padding:8px 12px;font-size:15px}
.pv{padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.pv:last-child{border-bottom:0}
.pv small{display:block;color:var(--mute)}
.pv.er{background:var(--warn);color:var(--warnink)}
.pv.er small{color:var(--warnink)}
.cnt{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.cnt span{border:1px solid var(--line);border-radius:99px;padding:2px 12px;font-size:14px;background:var(--card)}
details summary{padding:10px 14px;cursor:pointer;min-height:44px}
.attr{font-size:13px;color:var(--mute);margin:6px 0}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>
<script>
//CORE_START
const KEY="cryptoHoldings.v2",AK="cryptoHoldings.apikey";
const GROUPS={exchange:"取引所",lending:"レンディング"};
const clone=o=>JSON.parse(JSON.stringify(o));
const EMPTY={v:2,asOf:null,services:[],coins:[],holdings:{},prices:{},fetch:null,history:[]};
const CGRE=/^[a-z0-9._-]+$/i,DRE=/^\d{4}-\d{2}-\d{2}$/;
const API="https://api.coingecko.com/api/v3";
const jstDate=iso=>new Date(Date.parse(iso)+32400000).toISOString().slice(0,10);
const jstTime=iso=>{const j=new Date(Date.parse(iso)+32400000).toISOString();return j.slice(0,4)+"/"+j.slice(5,7)+"/"+j.slice(8,10)+" "+j.slice(11,16)};
const norm=s=>String(s==null?"":s).normalize("NFKC").trim().toLowerCase().replace(/\s+/g," ");
let _n=0;const newId=p=>p+Date.now().toString(36)+(_n++).toString(36);

/* ---- 数量（小数の精度を保つ） ---- */
function expandExp(s){const m=/^(\d+)(?:\.(\d+))?[eE]([+-]?\d+)$/.exec(s);if(!m)return null;const e=parseInt(m[3],10);if(Math.abs(e)>40)return null;
const digits=m[1]+(m[2]||""),pt=m[1].length+e;if(pt<=0)return"0."+"0".repeat(-pt)+digits;if(pt>=digits.length)return digits+"0".repeat(pt-digits.length);return digits.slice(0,pt)+"."+digits.slice(pt)}
function normDec(t){let[i,f=""]=t.split(".");i=i.replace(/^0+(?=\d)/,"");f=f.replace(/0+$/,"");return f?i+"."+f:i}
function plain(n){const s=String(n);return/e/i.test(s)?expandExp(s):s}
function toStored(dec){const n=Number(dec);if(Number.isFinite(n)){const p=plain(n);if(p&&normDec(p)===dec)return n}return dec}
function parseQty(s){if(s==null)return{ok:true,v:null,dec:null};
let t=String(s).normalize("NFKC").replace(/[,，、\s]/g,"");if(t==="")return{ok:true,v:null,dec:null};
if(/^\d+(\.\d+)?[eE][+-]?\d+$/.test(t)){const x=expandExp(t);if(x==null)return{ok:false,v:null,dec:null};t=x}
if(t[0]===".")t="0"+t;t=t.replace(/\.$/,"");
if(!/^\d+(\.\d+)?$/.test(t)||t.length>60)return{ok:false,v:null,dec:null};
const dec=normDec(t);return{ok:true,v:toStored(dec),dec}}
const qnum=v=>v==null?null:Number(v);
const qdec=v=>v==null?null:typeof v==="string"?normDec(v):normDec(plain(v));
const okQ=q=>q===null||(typeof q==="number"&&Number.isFinite(q)&&q>=0)||(typeof q==="string"&&/^\d+(\.\d+)?$/.test(q));

/* ---- 銘柄の候補（IDは検索で確認できたもの以外は一般的なIDです。取得できない場合は「価格なし」と表示されます） ---- */
const CATALOG=[["bitcoin","BTC","ビットコイン","Bitcoin"],["ethereum","ETH","イーサリアム","Ethereum"],["ripple","XRP","リップル","XRP Ripple"],["solana","SOL","ソラナ","Solana"],["bitcoin-cash","BCH","ビットコインキャッシュ","Bitcoin Cash"],["binancecoin","BNB","BNB","Binance Coin","バイナンスコイン"],["cardano","ADA","エイダ","Cardano","カルダノ"],["dogecoin","DOGE","ドージコイン","Dogecoin"],["litecoin","LTC","ライトコイン","Litecoin"],["polkadot","DOT","ポルカドット","Polkadot"],["avalanche-2","AVAX","アバランチ","Avalanche"],["chainlink","LINK","チェーンリンク","Chainlink"],["stellar","XLM","ステラルーメン","Stellar Lumens"],["tron","TRX","トロン","Tron"],["shiba-inu","SHIB","シバイヌ","Shiba Inu","柴犬"],["ethereum-classic","ETC","イーサリアムクラシック","Ethereum Classic"],["cosmos","ATOM","コスモス","Cosmos"],["algorand","ALGO","アルゴランド","Algorand"],["tether","USDT","テザー","Tether"],["usd-coin","USDC","USDコイン","USD Coin"],["the-open-network","TON","トンコイン","Toncoin"],["nem","XEM","ネム","NEM"],["symbol","XYM","シンボル","Symbol"],["zaif-token","ZAIF","ザイフ","Zaif Token"],["sui","SUI","スイ","Sui"],["aptos","APT","アプトス","Aptos"],["near","NEAR","ニア","NEAR Protocol"],["uniswap","UNI","ユニスワップ","Uniswap"],["monero","XMR","モネロ","Monero"],["internet-computer","ICP","インターネットコンピュータ","Internet Computer"],["filecoin","FIL","ファイルコイン","Filecoin"],["hedera-hashgraph","HBAR","ヘデラ","Hedera"],["arbitrum","ARB","アービトラム","Arbitrum"],["optimism","OP","オプティミズム","Optimism"],["pepe","PEPE","ペペ","Pepe"],["chiliz","CHZ","チリーズ","Chiliz"],["enjincoin","ENJ","エンジンコイン","Enjin Coin"],["decentraland","MANA","ディセントラランド","Decentraland"],["the-sandbox","SAND","サンドボックス","The Sandbox"],["basic-attention-token","BAT","ベーシックアテンショントークン","Basic Attention Token"]]
.map(([cg,sym,ja,en,al])=>({cg,sym,ja,en,al:al?[al]:[]}));

/* ---- データ検証・読み込み ---- */
function check(d){if(!d||d.v!==2||!Array.isArray(d.services)||!Array.isArray(d.coins)||!d.holdings||typeof d.holdings!=="object")throw new Error("データの形式が違います");
const sid=new Set(),cid=new Set();
for(const s of d.services){if(!s||!s.id||!s.name||!GROUPS[s.group]||sid.has(s.id))throw new Error("サービス情報が不正です");sid.add(s.id)}
for(const c of d.coins){if(!c||!c.id||!c.sym||cid.has(c.id)||(c.cg!=null&&!CGRE.test(c.cg)))throw new Error("銘柄情報が不正です");c.name=c.name||c.sym;c.cg=c.cg||null;cid.add(c.id)}
for(const s in d.holdings){if(!sid.has(s))throw new Error("保有データのサービスが不明です");for(const c in d.holdings[s]){const q=d.holdings[s][c];if(!cid.has(c)||!okQ(q))throw new Error("保有数量が不正です");if(typeof q==="string")d.holdings[s][c]=toStored(normDec(q))}}
d.prices=d.prices&&typeof d.prices==="object"?d.prices:{};
for(const c in d.prices){const p=d.prices[c];if(!cid.has(c)||!p||!(typeof p.jpy==="number"&&Number.isFinite(p.jpy)&&p.jpy>0)||typeof p.at!=="string")delete d.prices[c];else p.src=p.src==="manual"?"manual":"auto"}
const hs=new Map();for(const h of(Array.isArray(d.history)?d.history:[])){if(h&&DRE.test(h.date)&&Number.isFinite(h.total)){for(const k of["excluded","stale","manual","svc","coin"])if(!Array.isArray(h[k]))h[k]=[];hs.set(h.date,h)}}
d.history=[...hs.values()].sort((a,b)=>a.date<b.date?-1:1);
d.fetch=d.fetch||null;d.asOf=d.asOf||null;return d}
function load(st){try{return check(JSON.parse(st.getItem(KEY)))}catch(e){return clone(EMPTY)}}
function save(st,d){try{st.setItem(KEY,JSON.stringify(d));return true}catch(e){return false}}

/* ---- 価格・評価額 ---- */
function applyFailure(d,now,msg){d.fetch={okAt:d.fetch?d.fetch.okAt:null,fresh:[],missing:[],error:msg,tried:now}}
function applyPrices(d,j,now){const fresh=[],missing=[];for(const c of d.coins){if(!c.cg)continue;const p=j&&typeof j==="object"&&j[c.cg]?j[c.cg].jpy:null;if(typeof p==="number"&&Number.isFinite(p)&&p>0){d.prices[c.id]={jpy:p,at:now,src:"auto"};fresh.push(c.id)}else missing.push(c.id)}
if(!fresh.length)return applyFailure(d,now,"価格が1件も返ってきませんでした");d.fetch={okAt:now,fresh,missing,error:null,tried:now}}
function valuate(d){const fresh=new Set((d.fetch&&d.fetch.fresh)||[]);const coin={},svc={},grp={exchange:0,lending:0};let total=0;
for(const c of d.coins){const p=d.prices[c.id];coin[c.id]={qty:0,value:0,price:p?p.jpy:null,at:p?p.at:null,qmiss:false,status:!p?(c.cg?"none":"noid"):(p.src==="manual"?"manual":fresh.has(c.id)?"fresh":"stale")}}
for(const s of d.services)svc[s.id]={value:0,excl:[],qmiss:0};
for(const sid in d.holdings)for(const cid in d.holdings[sid]){const q=qnum(d.holdings[sid][cid]),ci=coin[cid],si=svc[sid];if(!ci||!si)continue;
if(q==null){ci.qmiss=true;si.qmiss++;continue}ci.qty+=q;if(ci.price!=null){const v=q*ci.price;ci.value+=v;si.value+=v;total+=v}else if(q>0)si.excl.push(cid)}
for(const s of d.services)grp[s.group]+=svc[s.id].value;
const pick=f=>d.coins.filter(c=>coin[c.id].qty>0&&f(coin[c.id])).map(c=>c.id);
return{coin,svc,grp,total,excluded:pick(x=>x.status==="none"||x.status==="noid"),stale:pick(x=>x.status==="stale"),manual:pick(x=>x.status==="manual"),qmiss:d.coins.filter(c=>coin[c.id].qmiss).map(c=>c.id)}}
function snapshot(d,V,now){const r=Math.round,sym=ids=>d.coins.filter(c=>ids.includes(c.id)).map(c=>c.sym);
const rec={date:jstDate(now),at:now,total:r(V.total),exchange:r(V.grp.exchange),lending:r(V.grp.lending),excluded:sym(V.excluded),stale:sym(V.stale),manual:sym(V.manual),
svc:d.services.map(s=>[s.name,r(V.svc[s.id].value)]),coin:d.coins.filter(c=>V.coin[c.id].qty>0).map(c=>[c.sym,r(V.coin[c.id].value)])};
d.history=d.history.filter(h=>h.date!==rec.date);d.history.push(rec);d.history.sort((a,b)=>a.date<b.date?-1:1);return rec}
function touchToday(d,now){if(d.history.some(h=>h.date===jstDate(now)))snapshot(d,valuate(d),now)}
function histDiff(d,date,total,excluded){const p=d.history.filter(h=>h.date<date).pop();if(!p)return null;const a=total-p.total;
return{amount:a,pct:p.total?a/p.total*100:null,prevDate:p.date,caution:[...excluded].sort().join()!==[...p.excluded].sort().join()}}
const KE=m=>{const e=new Error(m);e.known=true;return e};
async function fetchPrices(d,f,now,key){const ids=[...new Set(d.coins.filter(c=>c.cg).map(c=>c.cg))];
if(!ids.length){applyFailure(d,now,"価格を取得する銘柄のIDがありません");return false}
const ac=typeof AbortController!=="undefined"?new AbortController():null,to=setTimeout(()=>{if(ac)ac.abort()},15000);
try{const r=await f(API+"/simple/price?vs_currencies=jpy&ids="+ids.map(encodeURIComponent).join(",")+(key?"&x_cg_demo_api_key="+encodeURIComponent(key):""),{cache:"no-store",signal:ac?ac.signal:undefined});
if(r.status===429)throw KE("取得回数の上限に達しました。1分ほど待ってから、もう一度押してください");
if(!r.ok)throw KE("価格サービスがエラーを返しました（HTTP "+r.status+"）");
let j;try{j=await r.json()}catch(_){throw KE("応答を読み取れませんでした")}
applyPrices(d,j,now);if(d.fetch.error)return false;if(d.services.length)snapshot(d,valuate(d),now);return true}
catch(e){applyFailure(d,now,e&&e.known?e.message:e&&e.name==="AbortError"?"時間切れでした":"通信できませんでした（回線、またはブラウザの制限の可能性があります）");return false}
finally{clearTimeout(to)}}
async function searchCoins(f,q,key){const r=await f(API+"/search?query="+encodeURIComponent(q)+(key?"&x_cg_demo_api_key="+encodeURIComponent(key):""),{cache:"no-store"});
if(r.status===429)throw KE("取得回数の上限です。1分ほど待ってください");if(!r.ok)throw KE("検索できませんでした（HTTP "+r.status+"）");
const j=await r.json();return(j.coins||[]).filter(c=>c&&CGRE.test(String(c.id))).slice(0,6).map(c=>({id:c.id,name:c.name,sym:c.symbol,rank:c.market_cap_rank||null}))}

/* ---- 銘柄の検索（名前・略称） ---- */
function findCoins(d,query){const k=norm(query);if(!k)return[];const cand=[],usedCg=new Set(d.coins.map(c=>c.cg).filter(Boolean)),usedSym=new Set(d.coins.map(c=>norm(c.sym)));
for(const c of d.coins)cand.push({existingId:c.id,sym:c.sym,name:c.name,cg:c.cg,names:[c.sym,c.name],src:0});
for(const e of CATALOG){if(usedCg.has(e.cg)||usedSym.has(norm(e.sym)))continue;cand.push({existingId:null,sym:e.sym,name:e.ja,cg:e.cg,names:[e.sym,e.ja,e.en,...e.al],src:1})}
const out=[];for(const c of cand){const ns=c.names.map(norm);let sc=ns.some((n,i)=>i===0&&n===k)?0:ns.some(n=>n===k)?1:ns.some(n=>n.startsWith(k))?2:ns.some(n=>n.includes(k))?3:9;if(sc<9)out.push({...c,sc})}
out.sort((a,b)=>a.sc-b.sc||a.src-b.src);return out.slice(0,8)}

/* ---- CSV ---- */
const HEAD=["サービス名","区分","銘柄","数量"];
const GL={"取引所":"exchange","レンディング":"lending","exchange":"exchange","lending":"lending"};
const SAMPLE_CSV="サービス名,区分,銘柄,数量\r\nサンプル取引所A,取引所,BTC,0.01234567\r\nサンプル取引所A,取引所,ETH,0.5\r\nサンプル取引所B,取引所,リップル,1500.25\r\nサンプル取引所B,取引所,SOL,\r\nサンプルレンディング,レンディング,BTC,0.005\r\nサンプルレンディング,レンディング,ETH,0\r\n";
function decodeBytes(buf){try{return new TextDecoder("utf-8",{fatal:true}).decode(buf)}catch(e){try{return new TextDecoder("shift_jis").decode(buf)}catch(e2){return null}}}
function parseCSV(text,delim){delim=delim||",";const t=String(text).replace(/^﻿/,"");const recs=[];let cur=[],f="",q=false,line=1,start=1,seen=false;
const end=()=>{cur.push(f);recs.push({line:start,cells:cur});cur=[];f="";seen=false};
for(let i=0;i<t.length;i++){const c=t[i];
if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else{f+=c;if(c==="\n")line++}continue}
if(c==='"'&&f===""){q=true;seen=true;continue}
if(c===delim){cur.push(f);f="";seen=true;continue}

}

if(!p.ok||(n!=null&&!(n>0))){toast="円単価は、0より大きい数字で入力してください";render(true);return}
if(n==null){if(S.prices[c.id]&&S.prices[c.id].src==="manual")delete S.prices[c.id]}else S.prices[c.id]={jpy:n,at:nowIso(),src:"manual"};
touchToday(S,nowIso());persist();toast=n==null?c.sym+"の手入力価格を消しました":c.sym+"の円単価を保存しました";render(true)}
else if(t.dataset.f==="sname"){const s=S.services.find(x=>x.id===t.dataset.s);if(s&&t.value.trim()){s.name=t.value.trim();persist()}}
else if(t.dataset.f==="sgrp"){const s=S.services.find(x=>x.id===t.dataset.s);if(s&&GROUPS[t.value]){s.group=t.value;afterChange();render(true)}}
else if(t.id==="ak"){try{ST.setItem(AK,t.value.trim())}catch(_){}}
else if(t.id==="csvf"&&t.files[0]){const f=t.files[0];let buf;try{buf=await f.arrayBuffer()}catch(_){toast="ファイルを読めませんでした";render(true);return}
const txt=decodeBytes(buf);if(txt==null){toast="文字コードを判別できませんでした。UTF-8かShift_JISで保存してください";render(true);return}
cs.text=txt;cs.plan=planImport(S,txt);render(true)}
else if(t.id==="rf"&&t.files[0]){const fr=new FileReader();fr.onload=()=>{$("#rt").value=String(fr.result);impText=$("#rt").value};fr.readAsText(t.files[0])}});
document.addEventListener("focusin",e=>{const t=e.target;if(t.classList&&t.classList.contains("q"))setTimeout(()=>{try{t.select()}catch(_){}},0)});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&view==="home"&&S.services.length&&(!S.fetch||!S.fetch.tried||Date.now()-Date.parse(S.fetch.tried)>300000))refreshPrices()});
render();
if(S.services.length&&(!S.fetch||!S.fetch.tried||Date.now()-Date.parse(S.fetch.tried)>60000))refreshPrices();
</script>
</body>
</html>
