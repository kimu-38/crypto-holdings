<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="保有資産">
<meta name="theme-color" content="#14202b">
<title>保有資産</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#14202b;--mute:#5d6b78;--line:#d6dde4;--acc:#1f4fd8;--accink:#fff;--bar:#c9d6f7;--up:#0a7a48;--down:#b42318;--warn:#fff4d6;--warnink:#6b4a00;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f151b;--card:#18212a;--ink:#e7edf3;--mute:#98a6b3;--line:#2b3742;--acc:#7a9bff;--accink:#0f151b;--bar:#24365e;--up:#4cd08e;--down:#ff8a7d;--warn:#3a2f10;--warnink:#f3d98b}}
:root[data-theme="dark"]{--bg:#0f151b;--card:#18212a;--ink:#e7edf3;--mute:#98a6b3;--line:#2b3742;--acc:#7a9bff;--accink:#0f151b;--bar:#24365e;--up:#4cd08e;--down:#ff8a7d;--warn:#3a2f10;--warnink:#f3d98b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:540px;margin:0 auto;padding:16px 14px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-size:15px;font-weight:500;color:var(--mute);margin:4px 0 2px}
h2{font-size:16px;margin:22px 0 8px}
.big{font-size:clamp(38px,12vw,56px);font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.big small{font-size:.4em;font-weight:500;margin-left:4px}
.sub{color:var(--mute);font-size:14px}
.up{color:var(--up)}.down{color:var(--down)}
.diff{font-size:20px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.two .card{padding:12px 14px}.two b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.row{padding:11px 14px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.row:last-child{border-bottom:0}
.row .amt{font-weight:500;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.row .s2{color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);color:var(--mute);border-radius:99px;padding:0 8px;margin-left:6px}
.tag.w{background:var(--warn);color:var(--warnink);border-color:transparent}
button{font:inherit;min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:0 18px;cursor:pointer;font-weight:500}
button.p{background:var(--acc);color:var(--accink);border-color:var(--acc);width:100%;font-size:18px;font-weight:700;margin-top:14px}
button.p:disabled{opacity:.6}
button.s{min-height:44px;padding:0 12px;font-size:14px}
button.dg{color:var(--down)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.warn{background:var(--warn);color:var(--warnink);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:15px}
.warn b{font-weight:700}
.toast{background:var(--acc);color:var(--accink);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:500}
.tabs{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs button{border:0;border-radius:0;background:none;min-height:56px;font-size:14px;color:var(--mute);padding:0 4px}
.tabs button[aria-current="page"]{color:var(--acc);font-weight:700}
.qrow{display:grid;grid-template-columns:1fr 150px 40px;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.qrow input{text-align:right;font-size:18px;min-height:46px;font-variant-numeric:tabular-nums}
.qrow .x{min-height:40px;padding:0;color:var(--mute)}
.hd{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;background:var(--bg);border-bottom:1px solid var(--line);font-weight:700}
.hd span:last-child{font-variant-numeric:tabular-nums}
.add{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 14px}
.stack{display:grid;gap:8px;padding:12px 14px}
.cb{display:grid;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.cb:last-child{border-bottom:0}
.cb .two2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cb .lbl{font-size:13px;color:var(--mute);margin-bottom:2px}
.cand{display:grid;gap:6px}
.cand button{min-height:44px;text-align:left;font-size:14px;font-weight:400}
.hrow{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;border:0;border-bottom:1px solid var(--line);border-radius:0;background:var(--card);min-height:64px;padding:8px 14px;gap:10px}
.hrow:last-child{border-bottom:0}
.hrow .amt{font-variant-numeric:tabular-nums;white-space:nowrap}
.srow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:center}
.srow:last-child{border-bottom:0}
textarea{min-height:110px;font:13px/1.4 ui-monospace,Menlo,monospace}
a{color:var(--acc)}
.foot{margin-top:22px;font-size:12px;color:var(--mute)}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" id="tabs"></nav>
<script>
//CORE_START
const KEY="cryptoHoldings.v2",AK="cryptoHoldings.apikey";
const GROUPS={exchange:"取引所",lending:"レンディング"};
const clone=o=>JSON.parse(JSON.stringify(o));
const EMPTY={v:2,asOf:null,services:[],coins:[],holdings:{},prices:{},fetch:null,history:[]};
const CGRE=/^[a-z0-9._-]+$/i,DRE=/^\d{4}-\d{2}-\d{2}$/;
const API="https://api.coingecko.com/api/v3";
const jstDate=iso=>new Date(Date.parse(iso)+32400000).toISOString().slice(0,10);
const jstTime=iso=>{const j=new Date(Date.parse(iso)+32400000).toISOString();return j.slice(0,4)+"/"+j.slice(5,7)+"/"+j.slice(8,10)+" "+j.slice(11,16)};
function parseQty(s){if(s==null)return{ok:true,v:null};const t=String(s).normalize("NFKC").replace(/[,、，\s]/g,"");if(t==="")return{ok:true,v:null};if(!/^\d+(\.\d+)?$/.test(t))return{ok:false,v:null};const v=Number(t);return Number.isFinite(v)?{ok:true,v}:{ok:false,v:null}}
function check(d){if(!d||d.v!==2||!Array.isArray(d.services)||!Array.isArray(d.coins)||!d.holdings||typeof d.holdings!=="object")throw new Error("データの形式が違います");
const sid=new Set(),cid=new Set();
for(const s of d.services){if(!s||!s.id||!s.name||!GROUPS[s.group]||sid.has(s.id))throw new Error("サービス情報が不正です");sid.add(s.id)}
for(const c of d.coins){if(!c||!c.id||!c.sym||cid.has(c.id)||(c.cg!=null&&!CGRE.test(c.cg)))throw new Error("銘柄情報が不正です");c.name=c.name||c.sym;c.cg=c.cg||null;cid.add(c.id)}
for(const s in d.holdings){if(!sid.has(s))throw new Error("保有データのサービスが不明です");for(const c in d.holdings[s]){const q=d.holdings[s][c];if(!cid.has(c)||!(q===null||(typeof q==="number"&&Number.isFinite(q)&&q>=0)))throw new Error("保有数量が不正です")}}
d.prices=d.prices&&typeof d.prices==="object"?d.prices:{};
for(const c in d.prices){const p=d.prices[c];if(!cid.has(c)||!p||!(typeof p.jpy==="number"&&Number.isFinite(p.jpy)&&p.jpy>0)||typeof p.at!=="string")delete d.prices[c];else p.src=p.src==="manual"?"manual":"auto"}
const hs=new Map();for(const h of(Array.isArray(d.history)?d.history:[])){if(h&&DRE.test(h.date)&&Number.isFinite(h.total)){for(const k of["excluded","stale","manual","svc","coin"])if(!Array.isArray(h[k]))h[k]=[];hs.set(h.date,h)}}
d.history=[...hs.values()].sort((a,b)=>a.date<b.date?-1:1);
d.fetch=d.fetch||null;d.asOf=d.asOf||null;return d}
function load(st){try{return check(JSON.parse(st.getItem(KEY)))}catch(e){return clone(EMPTY)}}
function save(st,d){try{st.setItem(KEY,JSON.stringify(d));return true}catch(e){return false}}
function applyFailure(d,now,msg){d.fetch={okAt:d.fetch?d.fetch.okAt:null,fresh:[],missing:[],error:msg,tried:now}}
function applyPrices(d,j,now){const fresh=[],missing=[];for(const c of d.coins){if(!c.cg)continue;const p=j&&typeof j==="object"&&j[c.cg]?j[c.cg].jpy:null;if(typeof p==="number"&&Number.isFinite(p)&&p>0){d.prices[c.id]={jpy:p,at:now,src:"auto"};fresh.push(c.id)}else missing.push(c.id)}
if(!fresh.length)return applyFailure(d,now,"価格が1件も返ってきませんでした");d.fetch={okAt:now,fresh,missing,error:null,tried:now}}
function valuate(d){const fresh=new Set((d.fetch&&d.fetch.fresh)||[]);const coin={},svc={},grp={exchange:0,lending:0};let total=0;
for(const c of d.coins){const p=d.prices[c.id];coin[c.id]={qty:0,value:0,price:p?p.jpy:null,at:p?p.at:null,qmiss:false,status:!p?(c.cg?"none":"noid"):(p.src==="manual"?"manual":fresh.has(c.id)?"fresh":"stale")}}
for(const s of d.services)svc[s.id]={value:0,excl:[],qmiss:0};
for(const sid in d.holdings)for(const cid in d.holdings[sid]){const q=d.holdings[sid][cid],ci=coin[cid],si=svc[sid];if(!ci||!si)continue;
if(q==null){ci.qmiss=true;si.qmiss++;continue}ci.qty+=q;if(ci.price!=null){const v=q*ci.price;ci.value+=v;si.value+=v;total+=v}else if(q>0)si.excl.push(cid)}
for(const s of d.services)grp[s.group]+=svc[s.id].value;
const pick=f=>d.coins.filter(c=>coin[c.id].qty>0&&f(coin[c.id])).map(c=>c.id);
return{coin,svc,grp,total,excluded:pick(x=>x.status==="none"||x.status==="noid"),stale:pick(x=>x.status==="stale"),manual:pick(x=>x.status==="manual"),qmiss:d.coins.filter(c=>coin[c.id].qmiss).map(c=>c.id)}}
function snapshot(d,V,now){const r=Math.round,sym=ids=>d.coins.filter(c=>ids.includes(c.id)).map(c=>c.sym);
const rec={date:jstDate(now),at:now,total:r(V.total),exchange:r(V.grp.exchange),lending:r(V.grp.lending),excluded:sym(V.excluded),stale:sym(V.stale),manual:sym(V.manual),
svc:d.services.map(s=>[s.name,r(V.svc[s.id].value)]),coin:d.coins.filter(c=>V.coin[c.id].qty>0).map(c=>[c.sym,r(V.coin[c.id].value)])};
d.history=d.history.filter(h=>h.date!==rec.date);d.history.push(rec);d.history.sort((a,b)=>a.date<b.date?-1:1);return rec}
function touchToday(d,now){if(d.history.some(h=>h.date===jstDate(now)))snapshot(d,valuate(d),now)}
function histDiff(d,date,total,excluded){const p=d.history.filter(h=>h.date<date).pop();if(!p)return null;const a=total-p.total;
return{amount:a,pct:p.total?a/p.total*100:null,prevDate:p.date,caution:[...excluded].sort().join()!==[...p.excluded].sort().join()}}
const KE=m=>{const e=new Error(m);e.known=true;return e};
async function fetchPrices(d,f,now,key){const ids=[...new Set(d.coins.filter(c=>c.cg).map(c=>c.cg))];
if(!ids.length){applyFailure(d,now,"価格を取得する銘柄のIDがありません");return false}
const ac=typeof AbortController!=="undefined"?new AbortController():null,to=setTimeout(()=>{if(ac)ac.abort()},15000);
try{const r=await f(API+"/simple/price?vs_currencies=jpy&ids="+ids.map(encodeURIComponent).join(",")+(key?"&x_cg_demo_api_key="+encodeURIComponent(key):""),{cache:"no-store",signal:ac?ac.signal:undefined});
if(r.status===429)throw KE("取得回数の上限に達しました。1分ほど待ってから、もう一度押してください");
if(!r.ok)throw KE("価格サービスがエラーを返しました（HTTP "+r.status+"）");
let j;try{j=await r.json()}catch(_){throw KE("応答を読み取れませんでした")}
applyPrices(d,j,now);if(d.fetch.error)return false;if(d.services.length)snapshot(d,valuate(d),now);return true}
catch(e){applyFailure(d,now,e&&e.known?e.message:e&&e.name==="AbortError"?"時間切れでした":"通信できませんでした（回線、またはブラウザの制限の可能性があります）");return false}
finally{clearTimeout(to)}}
async function searchCoins(f,q,key){const r=await f(API+"/search?query="+encodeURIComponent(q)+(key?"&x_cg_demo_api_key="+encodeURIComponent(key):""),{cache:"no-store"});
if(r.status===429)throw KE("取得回数の上限です。1分ほど待ってください");if(!r.ok)throw KE("検索できませんでした（HTTP "+r.status+"）");
const j=await r.json();return(j.coins||[]).filter(c=>c&&CGRE.test(String(c.id))).slice(0,6).map(c=>({id:c.id,name:c.name,sym:c.symbol,rank:c.market_cap_rank||null}))}
//CORE_END

let ST;try{ST=window.localStorage;ST.getItem(KEY)}catch(e){const m={};ST={getItem:k=>m[k]??null,setItem:(k,v)=>{m[k]=v}}}
let S=load(ST),view="home",histSel=null,busy=false,armed="",toast="",saved=true,impText="",cand={},candMsg={};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen=n=>Math.round(n).toLocaleString("ja-JP");
const pf=n=>n>=100?yen(n):n>=1?n.toLocaleString("ja-JP",{maximumFractionDigits:2}):n.toLocaleString("ja-JP",{maximumSignificantDigits:4});
const qs=n=>Number(n).toLocaleString("ja-JP",{maximumFractionDigits:8});
const fdate=s=>s.replace(/-/g,"/");
const nowIso=()=>new Date().toISOString();
const todayJ=()=>jstDate(nowIso());
const persist=()=>{saved=save(ST,S)};
const apiKey=()=>{try{return(ST.getItem(AK)||"").trim()}catch(e){return""}};
const cn=id=>{const c=S.coins.find(x=>x.id===id);return c?c.name+(c.name!==c.sym?"（"+c.sym+"）":""):id};
const names=ids=>ids.map(i=>S.coins.find(c=>c.id===i).sym).join("、");
const syms=ids=>ids.map(i=>S.coins.find(c=>c.id===i).sym);

function dh(df){if(!df)return'<div class="sub">比べる前回の記録は、まだありません</div>';
const up=df.amount>0,dn=df.amount<0,sg=up?"+":dn?"−":"±",pct=df.pct==null?"":"（"+sg+Math.abs(df.pct).toFixed(2)+"%）";
return`<div class="diff ${up?"up":dn?"down":""}">${sg}${yen(Math.abs(df.amount))}円${pct}</div><div class="sub">${fdate(df.prevDate)}の記録からの評価額の変化です。売買や数量の修正も含みます${df.caution?"。除外している銘柄が前回と違うため、参考値です":""}</div>`}

function home(){
if(!S.services.length)return`<h1>保有資産</h1><div class="big">0<small>円</small></div><div class="warn">まだ保有データがありません。「設定」の「データの取り込み」に、初期データのJSONを貼り付けるか、ファイルを選んでください。</div><button class="p" data-tab="settings">設定を開く</button>`;
const V=valuate(S),f=S.fetch,part=V.excluded.length>0,tot=Math.round(V.total);
const df=histDiff(S,todayJ(),tot,syms(V.excluded));
const bn=[];
if(f&&f.error)bn.push(`価格を取得できませんでした：${esc(f.error)}（${jstTime(f.tried)}）。`+(f.okAt?`${jstTime(f.okAt)}に取得した価格などで計算しています。`:"取得済みの価格がありません。"));
if(f&&!f.error&&f.missing&&f.missing.length)bn.push(`価格サービスから返ってこなかった銘柄：${esc(names(f.missing))}。設定でCoinGecko IDを確認するか、円単価を手入力してください。`);
if(V.stale.length)bn.push(`前回取得した価格を使っている銘柄：${esc(names(V.stale))}。`);
if(V.manual.length)bn.push(`手入力の価格を使っている銘柄：${esc(names(V.manual))}。`);
if(V.qmiss.length)bn.push(`数量が未入力の銘柄：${esc(names(V.qmiss))}（合計に含まれません）。`);
const rows=S.coins.filter(c=>V.coin[c.id].qty>0||V.coin[c.id].qmiss).map(c=>({c,i:V.coin[c.id]})).sort((a,b)=>b.i.value-a.i.value);
return`${toast?`<div class="toast" role="status">${esc(toast)}</div>`:""}${saved?"":'<div class="warn">ブラウザに保存できませんでした。設定からバックアップを控えてください。</div>'}
<h1>合計評価額${part?"（一部銘柄を除いた合計）":""}</h1>
${part?`<div class="warn" role="alert"><b>一部銘柄を除いた合計です。</b>価格が一度も取得・入力されていないため、合計に含めていない銘柄：<b>${esc(names(V.excluded))}</b></div>`:""}
<div class="big">${yen(V.total)}<small>円</small></div>
${dh(df)}
<div class="sub" style="margin-top:6px">${f&&f.okAt?"価格の取得："+jstTime(f.okAt):"価格は未取得です"}${S.asOf?"・数量の基準日："+fdate(S.asOf):""}</div>
<button class="p" data-a="price" ${busy?"disabled":""}>${busy?"価格を取得中…":"価格を更新"}</button>
${bn.map(b=>`<div class="warn" role="alert">${b}</div>`).join("")}
<div class="two"><div class="card"><span class="sub">取引所</span><b>${yen(V.grp.exchange)}円</b></div><div class="card"><span class="sub">レンディング</span><b>${yen(V.grp.lending)}円</b></div></div>
<h2>銘柄別</h2><div class="card">${rows.map(({c,i})=>{const st=i.status;return`<div class="row"><span>${esc(c.name)}<span class="tag">${esc(c.sym)}</span>${st==="stale"?'<span class="tag w">前回価格</span>':st==="manual"?'<span class="tag w">手入力</span>':st==="none"||st==="noid"?'<span class="tag w">価格なし</span>':""}</span><span class="amt">${i.price==null?"合計に含めず":yen(i.value)+"円"}</span><span class="s2">${i.qmiss?"数量未入力あり・":""}${qs(i.qty)} ${esc(c.sym)}</span><span class="s2">${i.price==null?"価格なし":"@"+pf(i.price)+"円"+(st==="stale"?"（"+jstTime(i.at)+"に取得）":st==="manual"?"（"+jstTime(i.at)+"に手入力）":"")}</span></div>`}).join("")}</div>
<h2>サービス別</h2><div class="card">${S.services.map(s=>{const x=V.svc[s.id];return`<div class="row"><span>${esc(s.name)}<span class="tag">${GROUPS[s.group]}</span></span><span class="amt">${yen(x.value)}円</span>${x.excl.length?`<span class="s2" style="grid-column:1/-1">※${esc(names(x.excl))}は価格がないため含まれていません</span>`:""}</div>`}).join("")}</div>
<p class="foot">価格データ：<a href="https://www.coingecko.com/" target="_blank" rel="noopener">CoinGecko</a></p>`}

function qty(){
if(!S.services.length)return`<h1>数量</h1><div class="warn">データがありません。「設定」から初期データを取り込んでください。</div>`;
const V=valuate(S);
return`<h1>保有数量${S.asOf?"（基準日 "+fdate(S.asOf)+"）":""}</h1><p class="sub">売買や報酬で数量が変わったら、数字を直してください。入力欄を離れると保存されます。</p>
${S.services.map(s=>{const h=S.holdings[s.id]||{},ids=Object.keys(h),rest=S.coins.filter(c=>!(c.id in h));
return`<div class="card" style="margin-bottom:14px"><div class="hd"><span>${esc(s.name)}</span><span id="ss-${s.id}">${yen(V.svc[s.id].value)}円</span></div>
${ids.map(c=>`<div class="qrow"><label for="q-${s.id}-${c}">${esc(cn(c))}</label><input id="q-${s.id}-${c}" class="q" data-s="${s.id}" data-c="${c}" type="text" inputmode="decimal" autocomplete="off" placeholder="未入力" value="${h[c]==null?"":qs(h[c])}"><button class="x" data-a="rm" data-s="${s.id}" data-c="${c}" aria-label="${esc(cn(c))}を削除">${armed==="rm-"+s.id+"-"+c?"削除":"×"}</button></div>`).join("")}
${rest.length?`<div class="add"><select id="ad-${s.id}" aria-label="追加する銘柄">${rest.map(c=>`<option value="${c.id}">${esc(cn(c.id))}</option>`).join("")}</select><button class="s" data-a="addh" data-s="${s.id}">追加</button></div>`:""}</div>`}).join("")}`}

function history(){
const h=histSel&&S.history.find(x=>x.date===histSel);
if(h){const df=histDiff(S,h.date,h.total,h.excluded);
const notes=[];if(h.excluded.length)notes.push("価格がなく、合計に含めていない銘柄："+h.excluded.join("、"));if(h.stale.length)notes.push("前回取得した価格を使った銘柄："+h.stale.join("、"));if(h.manual.length)notes.push("手入力の価格を使った銘柄："+h.manual.join("、"));
return`<button class="s" data-a="hback">← 履歴に戻る</button><h1 style="margin-top:12px">${fdate(h.date)}の記録（${jstTime(h.at)}保存）</h1><div class="big">${yen(h.total)}<small>円</small></div>${dh(df)}
${notes.map(n=>`<div class="warn">${esc(n)}</div>`).join("")}
<div class="two"><div class="card"><span class="sub">取引所</span><b>${yen(h.exchange)}円</b></div><div class="card"><span class="sub">レンディング</span><b>${yen(h.lending)}円</b></div></div>
<h2>サービス別</h2><div class="card">${h.svc.map(([n,v])=>`<div class="row"><span>${esc(n)}</span><span class="amt">${yen(v)}円</span></div>`).join("")}</div>
<h2>銘柄別</h2><div class="card">${h.coin.map(([n,v])=>`<div class="row"><span>${esc(n)}</span><span class="amt">${yen(v)}円</span></div>`).join("")}</div>
<button class="dg" style="width:100%;margin-top:18px" data-a="hdel" data-d="${h.date}">${armed==="hd-"+h.date?"もう一度押すと、この日の記録を削除":"この日の記録を削除"}</button>`}
histSel=null;const rs=[...S.history].reverse();
return`<h1>評価額の履歴</h1><p class="sub">価格の更新に成功した日の評価額を、日本時間の日付ごとに1件保存します。同じ日に更新すると、その日の記録が新しい内容に置き換わります。</p>
${rs.length?`<div class="card" style="margin-top:8px">${rs.map(r=>{const df=histDiff(S,r.date,r.total,r.excluded),sg=df?(df.amount>0?"+":df.amount<0?"−":"±"):"";
return`<button class="hrow" data-a="hopen" data-d="${r.date}"><span><b>${fdate(r.date)}</b><br><span class="sub">${df?`前回比 <span class="${df.amount>0?"up":df.amount<0?"down":""}">${sg}${yen(Math.abs(df.amount))}円</span>${df.caution?"（参考値）":""}`:"最初の記録"}${r.excluded.length?"・一部除外":""}</span></span><span class="amt">${yen(r.total)}円</span></button>`}).join("")}</div><p class="sub">日付を押すと、内訳を確認できます。</p>`:'<p class="sub">まだ記録がありません。ホーム画面で価格の更新に成功すると、最初の記録が保存されます。</p>'}`}

function settings(){
return`${toast?`<div class="toast" role="status">${esc(toast)}</div>`:""}<h1>銘柄と価格</h1><p class="sub">価格は、CoinGeckoのIDで自動取得します。IDを空にした銘柄、または自動取得できない銘柄は、円単価を手入力できます。自動取得に成功すると、手入力より新しい自動の価格が使われます。</p>
<div class="card">${S.coins.map(c=>{const p=S.prices[c.id],cs=cand[c.id];return`<div class="cb"><input data-f="cname" data-c="${c.id}" value="${esc(c.name)}" aria-label="銘柄名"><div class="two2"><div><div class="lbl">CoinGecko ID</div><input data-f="cg" data-c="${c.id}" value="${esc(c.cg||"")}" placeholder="空欄＝手入力のみ" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="${esc(c.sym)}のCoinGecko ID"></div><div><div class="lbl">円単価（手入力）</div><input data-f="mp" data-c="${c.id}" inputmode="decimal" autocomplete="off" placeholder="例：0.013" value="${p&&p.src==="manual"?esc(String(p.jpy)):""}" aria-label="${esc(c.sym)}の円単価"></div></div>
<div class="sub">${esc(c.sym)}・現在の価格：${p?pf(p.jpy)+"円（"+(p.src==="manual"?"手入力":"自動取得")+"、"+jstTime(p.at)+"）":"なし"}</div>
<button class="s" data-a="srch" data-c="${c.id}">IDの候補を検索</button>
${candMsg[c.id]?`<div class="sub">${esc(candMsg[c.id])}</div>`:""}${cs?`<div class="cand">${cs.length?cs.map(x=>`<button data-a="pick" data-c="${c.id}" data-id="${esc(x.id)}">${esc(x.name)}（${esc(String(x.sym).toUpperCase())}）・時価総額順位 ${x.rank||"圏外"}・ID: ${esc(x.id)}</button>`).join(""):'<div class="sub">候補が見つかりませんでした</div>'}</div>`:""}</div>`}).join("")||'<div class="stack sub">銘柄がありません</div>'}</div>
<h2>銘柄を追加</h2><div class="card stack"><input id="nc-sym" placeholder="記号（例：DOGE）" autocapitalize="characters"><input id="nc-name" placeholder="名前（例：ドージコイン）"><input id="nc-cg" placeholder="CoinGecko ID（空欄なら手入力のみ）" autocapitalize="off" autocorrect="off" spellcheck="false"><button data-a="addc">追加</button></div>
<h2>サービス</h2><div class="card">${S.services.map(s=>`<div class="srow"><input data-f="sname" data-s="${s.id}" value="${esc(s.name)}" aria-label="サービス名"><span class="sub">${GROUPS[s.group]}</span></div>`).join("")||'<div class="stack sub">サービスがありません</div>'}</div>
<div class="card stack" style="margin-top:10px"><input id="ns-name" placeholder="サービス名" aria-label="新しいサービス名"><select id="ns-g" aria-label="種類"><option value="exchange">取引所</option><option value="lending">レンディング</option></select><button data-a="adds">サービスを追加</button></div>
<h2>データの取り込み</h2><div class="card stack"><div class="sub">初期データのJSONを貼り付けるか、ファイルを選んで取り込みます。サービス・銘柄・数量が置き換わります。保存済みの履歴と取得済みの価格は残ります。</div><textarea id="rt" placeholder="ここに貼り付け">${esc(impText)}</textarea><input id="rf" type="file" accept=".json,application/json,text/plain"><button class="dg" data-a="restore">${armed==="res"?"もう一度押すと、置き換えて取り込み":"取り込む"}</button><div id="rm" class="sub" role="status"></div></div>
<h2>バックアップ</h2><div class="card stack"><div class="sub">数量・価格・履歴をコピーして、自分だけが見られる場所に保管してください。</div><textarea id="bt" readonly>${esc(JSON.stringify(S,null,2))}</textarea><button data-a="copy">コピー</button></div>
<h2>CoinGecko APIキー（任意）</h2><div class="card stack"><div class="sub">通常は不要です。CoinGeckoが無料でもキーを求めるようになった場合だけ、Demoキーをここに入力します。この端末にだけ保存され、バックアップには含まれません。</div><input id="ak" type="password" autocomplete="off" autocapitalize="off" placeholder="空欄でOK" value="${esc(apiKey())}" aria-label="APIキー"></div>
<p class="foot">価格データ：<a href="https://www.coingecko.com/" target="_blank" rel="noopener">CoinGecko</a>。データはこの端末のブラウザ内に保存され、価格の取得時に保有数量が送られることはありません（送るのは銘柄のIDだけです）。</p>`}

function render(keep){const a=$("#app");a.innerHTML=view==="home"?home():view==="qty"?qty():view==="history"?history():settings();
$("#tabs").innerHTML=[["home","ホーム"],["history","履歴"],["qty","数量"],["settings","設定"]].map(([k,l])=>`<button data-tab="${k}" ${view===k?'aria-current="page"':""}>${l}</button>`).join("");
if(!keep)window.scrollTo(0,0)}

async function refreshPrices(){if(busy||!S.services.length)return;busy=true;render(true);
await fetchPrices(S,(u,o)=>fetch(u,o),nowIso(),apiKey());busy=false;persist();render(true)}

document.addEventListener("click",async e=>{const t=e.target.closest("[data-tab],[data-a]");if(!t)return;
if(t.dataset.tab){view=t.dataset.tab;histSel=null;armed="";toast="";render();return}
const a=t.dataset.a,s=t.dataset.s,c=t.dataset.c;
if(a==="price")refreshPrices();
else if(a==="hopen"){histSel=t.dataset.d;armed="";render()}
else if(a==="hback"){histSel=null;armed="";render()}
else if(a==="hdel"){const k="hd-"+t.dataset.d;if(armed!==k){armed=k;render(true)}else{S.history=S.history.filter(h=>h.date!==t.dataset.d);armed="";histSel=null;persist();render()}}
else if(a==="rm"){const k="rm-"+s+"-"+c;if(armed!==k){armed=k;render(true)}else{delete S.holdings[s][c];S.asOf=todayJ();armed="";touchToday(S,nowIso());persist();render(true)}}
else if(a==="addh"){const sel=$("#ad-"+s);if(!sel)return;(S.holdings[s]=S.holdings[s]||{})[sel.value]=null;persist();render(true)}
else if(a==="addc"){const sym=$("#nc-sym").value.trim().toUpperCase(),name=$("#nc-name").value.trim()||sym,cg=$("#nc-cg").value.trim();if(!sym)return $("#nc-sym").focus();if(cg&&!CGRE.test(cg)){toast="CoinGecko IDの形式が正しくありません";return render(true)}
S.coins.push({id:"c"+Date.now().toString(36),sym,name,cg:cg||null});persist();toast=sym+"を追加しました";render(true)}
else if(a==="adds"){const n=$("#ns-name").value.trim();if(!n)return $("#ns-name").focus();S.services.push({id:"s"+Date.now().toString(36),name:n,group:$("#ns-g").value});persist();render(true)}
else if(a==="srch"){const co=S.coins.find(x=>x.id===c);candMsg[c]="検索中…";cand[c]=null;render(true);
try{cand[c]=await searchCoins((u,o)=>fetch(u,o),co.sym,apiKey());candMsg[c]="同じ記号の別の銘柄が混ざるため、名前と順位を見て選んでください"}catch(err){cand[c]=null;candMsg[c]=err&&err.known?err.message:"検索できませんでした（通信を確認してください）"}render(true)}
else if(a==="pick"){const co=S.coins.find(x=>x.id===c);co.cg=t.dataset.id;cand[c]=null;candMsg[c]="";persist();toast=co.sym+"のIDを設定しました。ホームで「価格を更新」を押してください";render(true)}
else if(a==="copy"){const x=$("#bt");try{await navigator.clipboard.writeText(x.value)}catch(_){x.select();document.execCommand("copy")}t.textContent="コピーしました";setTimeout(()=>{t.textContent="コピー"},1500)}
else if(a==="restore"){const txt=$("#rt").value;impText=txt;if(armed!=="res"){armed="res";render(true);return}armed="";
try{const n=check(JSON.parse(txt));if(!n.history.length)n.history=S.history;for(const k in S.prices)if(!n.prices[k]&&n.coins.some(x=>x.id===k))n.prices[k]=S.prices[k];if(!n.fetch)n.fetch=S.fetch;S=n;persist();impText="";toast="データを取り込みました";view="home";render();refreshPrices()}catch(err){render(true);$("#rm").textContent="取り込めません："+err.message}}});
document.addEventListener("change",e=>{const t=e.target;
if(t.classList.contains("q")){const p=parseQty(t.value);if(!p.ok){toast="数字として読めません。数量を確認してください";render(true);return}
(S.holdings[t.dataset.s]=S.holdings[t.dataset.s]||{})[t.dataset.c]=p.v;S.asOf=todayJ();touchToday(S,nowIso());persist();t.value=p.v==null?"":qs(p.v);const V=valuate(S),el=$("#ss-"+t.dataset.s);if(el)el.textContent=yen(V.svc[t.dataset.s].value)+"円"}
else if(t.dataset.f==="cname"){const c=S.coins.find(x=>x.id===t.dataset.c);if(c&&t.value.trim()){c.name=t.value.trim();persist()}}
else if(t.dataset.f==="cg"){const c=S.coins.find(x=>x.id===t.dataset.c),v=t.value.trim();if(!c)return;if(v&&!CGRE.test(v)){t.value=c.cg||"";toast="IDの形式が正しくありません";render(true);return}c.cg=v||null;persist()}
else if(t.dataset.f==="mp"){const c=S.coins.find(x=>x.id===t.dataset.c);if(!c)return;const p=parseQty(t.value);
if(!p.ok||(p.v!=null&&p.v<=0)){toast="円単価は、0より大きい数字で入力してください";render(true);return}
if(p.v==null){if(S.prices[c.id]&&S.prices[c.id].src==="manual")delete S.prices[c.id]}else S.prices[c.id]={jpy:p.v,at:nowIso(),src:"manual"};
touchToday(S,nowIso());persist();toast=p.v==null?c.sym+"の手入力価格を消しました":c.sym+"の円単価を保存しました";render(true)}
else if(t.dataset.f==="sname"){const s=S.services.find(x=>x.id===t.dataset.s);if(s&&t.value.trim()){s.name=t.value.trim();persist()}}
else if(t.id==="ak"){try{ST.setItem(AK,t.value.trim())}catch(_){}}
else if(t.id==="rf"&&t.files[0]){const fr=new FileReader();fr.onload=()=>{$("#rt").value=String(fr.result);impText=$("#rt").value};fr.readAsText(t.files[0])}});
document.addEventListener("focusin",e=>{const t=e.target;if(t.classList&&t.classList.contains("q"))setTimeout(()=>{try{t.select()}catch(_){}},0)});
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&view==="home"&&S.services.length&&(!S.fetch||!S.fetch.tried||Date.now()-Date.parse(S.fetch.tried)>300000))refreshPrices()});
render();
if(S.services.length&&(!S.fetch||!S.fetch.tried||Date.now()-Date.parse(S.fetch.tried)>60000))refreshPrices();
</script>
</body>
</html>
